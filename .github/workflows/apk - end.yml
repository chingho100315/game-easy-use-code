name: apk - end

env:
  GH_TOKEN: ${{ github.token }}
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: 0
  APP_ANDROID_ACCEPT_SDK_LICENSE: "1"
  ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk
  ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
  PIP_USE_PEP517: "0"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_unsigned:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Download ZIP from Release
        run: |
          set -e
          TAG=v0.1.0
          REPO="$GITHUB_REPOSITORY"
          rm -rf app extracted release.zip
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          gh release view "$TAG" --repo "$REPO"
          if gh release download "$TAG" --repo "$REPO" -p "*.zip" --clobber; then
            ZIP=$(ls -1 *.zip | head -1)
            mv "$ZIP" release.zip
          else
            gh api "repos/$REPO/zipball/$TAG" > release.zip
          fi
          mkdir -p extracted
          unzip -q -O UTF-8 release.zip -d extracted 2>/dev/null || unzip -q release.zip -d extracted
          PROJECT_DIR=$(find extracted -type f \( -name "main.py" -o -name "__main__.py" \) -exec dirname {} \; | head -1)
          if [ -z "$PROJECT_DIR" ]; then
            find extracted -maxdepth 5
            exit 1
          fi
          if [ -d "$PROJECT_DIR/imprisonment" ]; then
            PROJECT_DIR="$PROJECT_DIR/imprisonment"
          fi
          mkdir -p app
          cp -r "$PROJECT_DIR"/. app/
          if [ ! -f app/main.py ] && [ -f app/__main__.py ]; then
            cp app/__main__.py app/main.py
          fi
          if [ ! -f app/__main__.py ] && [ -f app/main.py ]; then
            cp app/main.py app/__main__.py
          fi
          rm -f app/setup.py app/pyproject.toml app/_game_main.py
          find app -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
          find app -type f -name "*.pyc" -delete 2>/dev/null || true
          test -f app/main.py
          test -f app/buildozer.spec

      - name: Encode non-ASCII filenames to unicode map
        run: |
          set -e
          python3 << 'PY'
          import json, os, re
          from pathlib import Path

          ROOT = Path("app")

          def has_non_ascii(s: str) -> bool:
              return any(ord(c) > 127 for c in s)

          def encode_segment(seg: str) -> str:
              """同一规则：每个字符 -> 4位十六进制，下划线分隔，前缀 u，扩展名保留。"""
              if not has_non_ascii(seg):
                  return seg
              stem, ext = os.path.splitext(seg)
              # 扩展名若也有非ascii极少见；只编码 stem，ext 原样（一般为.ttc/.png）
              body = "_".join("%04x" % ord(c) for c in stem)
              return "u" + body + ext

          def encode_rel(rel: str) -> str:
              parts = rel.replace("\\", "/").split("/")
              return "/".join(encode_segment(p) for p in parts)

          # 收集所有文件（跳过构建噪声）
          files = []
          for p in sorted(ROOT.rglob("*")):
              if not p.is_file():
                  continue
              rel = str(p.relative_to(ROOT)).replace("\\", "/")
              if any(x in rel for x in (".git/", "__pycache__/", "p4a-recipes/", ".buildozer/", "filename.json")):
                  continue
              files.append(rel)

          mapping = []  # {orig, enc}  仅非ascii路径
          used_enc = set()
          for orig in files:
              enc = encode_rel(orig)
              if enc == orig:
                  continue
              # 避免碰撞
              base_enc = enc
              n = 1
              while enc in used_enc:
                  stem, ext = os.path.splitext(base_enc)
                  enc = "%s_%d%s" % (stem, n, ext)
                  n += 1
              used_enc.add(enc)
              mapping.append({"orig": orig, "enc": enc})

          # 先改文件名（从深到浅，避免父目录先改导致子路径失效：只改文件 basename 所在路径）
          # 按路径深度降序
          mapping.sort(key=lambda x: -x["orig"].count("/"))
          for item in mapping:
              src = ROOT / item["orig"]
              dst = ROOT / item["enc"]
              if not src.is_file():
                  print("SKIP missing", item["orig"])
                  continue
              dst.parent.mkdir(parents=True, exist_ok=True)
              if dst.exists():
                  raise SystemExit("collision: %s" % item["enc"])
              src.rename(dst)
              print("RENAME", item["orig"], "->", item["enc"])

          # 空目录清理（可选）
          for d in sorted(ROOT.rglob("*"), reverse=True):
              if d.is_dir() and not any(d.iterdir()):
                  try:
                      d.rmdir()
                  except OSError:
                      pass

          # 写入映射（顺序固定：按 orig 排序，保证两次一致）
          mapping.sort(key=lambda x: x["orig"])
          out = {
              "version": 1,
              "rule": "segment: non-ascii stem -> u + hex(ord) joined by _; ext kept; path segments joined by /",
              "items": mapping,
          }
          (ROOT / "filename.json").write_text(
              json.dumps(out, ensure_ascii=True, indent=2) + "\n",
              encoding="utf-8",
          )
          print("MAP_COUNT", len(mapping))
          print("WROTE app/filename.json")
          # 校验：enc 文件存在，orig 不存在
          bad = 0
          for item in mapping:
              if not (ROOT / item["enc"]).is_file():
                  print("MISSING ENC", item["enc"])
                  bad += 1
              if (ROOT / item["orig"]).exists():
                  print("ORIG STILL EXISTS", item["orig"])
                  bad += 1
          if bad:
              raise SystemExit("encode verify failed")
          PY
          test -f app/filename.json
          head -c 2000 app/filename.json
          echo
          ls -la app/font 2>/dev/null || true

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache NDK/SDK
        uses: actions/cache@v5
        with:
          path: /home/runner/.buildozer
          key: buildozer-ndk25b-sdk34-unicode-v1

      - name: Setup Environment
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y git zip unzip wget python3-pip python3-venv autoconf automake libltdl-dev libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev build-essential gettext
          pip3 install --user --upgrade buildozer "cython==0.29.36" "setuptools==59.8.0"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          SDK="$ANDROID_SDK_ROOT"
          mkdir -p "$SDK/cmdline-tools" "$SDK/licenses" "$HOME/.android"
          touch "$HOME/.android/repositories.cfg"
          if [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
            rm -rf "$SDK/cmdline-tools/latest"
            mv /tmp/cmdtools/cmdline-tools "$SDK/cmdline-tools/latest"
          fi
          echo "24333f8a63b6825ea9c5514f07c3498d" > "$SDK/licenses/android-sdk-license"
          echo "84831b9409646161cbf74d67cb9a794" > "$SDK/licenses/android-sdk-preview-license"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          mkdir -p "$SDK/tools/bin"
          ln -sf "$SDK/cmdline-tools/latest/bin/sdkmanager" "$SDK/tools/bin/sdkmanager"

      - name: Add local p4a recipes
        run: |
          python3 << 'ENDPY'
          import textwrap
          from pathlib import Path
          Path("app/p4a-recipes/pygame-ce").mkdir(parents=True, exist_ok=True)
          Path("extract.py").write_text(textwrap.dedent(r'''
          from pathlib import Path
          p = Path("out.txt")
          lines = p.read_text(errors="ignore").splitlines() if p.exists() else []
          skip = ("grpmodule", "Wimplicit", "print-multi-os", "CMake", "GITHUB_", "export ")
          keys = ("FOUND HEADER", "REWROTE", "PATCHED", "ENSURE HOST", "HOST CYTHON", "BUILD_EXT", "COPIED ", "SIMD STUB", "RENAME", "filename.json", "RESTORE", "error: ", "Command failed", "available in the bin", "FAILURE:")
          print("=== KEY ===")
          n = 0
          for l in lines:
              if any(s in l for s in skip):
                  continue
              if any(k in l for k in keys):
                  print(l[:400]); n += 1
                  if n >= 80:
                      break
          print("=== TAIL ===")
          useful = [l for l in lines if not (l.startswith("export ") or any(s in l for s in skip))]
          for l in useful[-40:]:
              print(l[:400])
          '''))
          Path("app/p4a-recipes/pygame-ce/__init__.py").write_text(textwrap.dedent(r'''
          import glob, os, re, sh, shutil, subprocess
          from os.path import exists, join
          from pythonforandroid.logger import shprint
          from pythonforandroid.recipe import CompiledComponentsPythonRecipe
          from pythonforandroid.toolchain import current_directory
          BAD = ("Xcode", ".framework", "macOS", "iOS", "tvOS", "VisualC", "mingw", "darwin", "windows")
          FILL_VOIDS = [
              "surface_fill_blend_add", "surface_fill_blend_sub", "surface_fill_blend_mult",
              "surface_fill_blend_min", "surface_fill_blend_max",
              "surface_fill_blend_rgba_add", "surface_fill_blend_rgba_sub", "surface_fill_blend_rgba_mult",
              "surface_fill_blend_rgba_min", "surface_fill_blend_rgba_max",
          ]
          def _fill(sfx):
              return [n + sfx for n in FILL_VOIDS]
          STUBS = {
          "simd_blitters_sse2.c": (
          ["pg_sse2_at_runtime_but_uncompiled", "pg_neon_at_runtime_but_uncompiled", "_pg_HasSSE_NEON"],
          ["alphablit_alpha_sse2_argb_no_surf_alpha", "alphablit_alpha_sse2_argb_no_surf_alpha_opaque_dst", "alphablit_alpha_sse2_argb_surf_alpha", "alphablit_alpha_sse2_argb_pixel_alpha", "blit_blend_premultiplied_sse2", "premul_surf_color_by_alpha_sse2", "blit_blend_rgb_add_sse2", "blit_blend_rgb_max_sse2", "blit_blend_rgb_min_sse2", "blit_blend_rgb_mul_sse2", "blit_blend_rgb_sub_sse2", "blit_blend_rgba_add_sse2", "blit_blend_rgba_max_sse2", "blit_blend_rgba_min_sse2", "blit_blend_rgba_mul_sse2", "blit_blend_rgba_sub_sse2"],
          ),
          "simd_blitters_avx2.c": (
          ["pg_has_avx2", "_pg_has_avx2", "pg_avx2_at_runtime_but_uncompiled"],
          ["alphablit_alpha_avx2_argb_no_surf_alpha", "alphablit_alpha_avx2_argb_no_surf_alpha_opaque_dst", "alphablit_alpha_avx2_argb_surf_alpha", "alphablit_alpha_avx2_argb_pixel_alpha", "alphablit_alpha_avx2_rgba_surf_alpha", "alphablit_alpha_avx2_rgba_pixel_alpha", "blit_blend_premultiplied_avx2", "premul_surf_color_by_alpha_avx2", "blit_blend_rgb_add_avx2", "blit_blend_rgb_max_avx2", "blit_blend_rgb_min_avx2", "blit_blend_rgb_mul_avx2", "blit_blend_rgb_sub_avx2", "blit_blend_rgba_add_avx2", "blit_blend_rgba_max_avx2", "blit_blend_rgba_min_avx2", "blit_blend_rgba_mul_avx2", "blit_blend_rgba_sub_avx2"],
          ),
          "simd_surface_fill_avx2.c": ([], _fill("_avx2")),
          "simd_surface_fill_sse2.c": ([], _fill("_sse2")),
          "simd_transform_sse2.c": (
          ["pg_sse2_at_runtime_but_uncompiled", "pg_neon_at_runtime_but_uncompiled"],
          ["filter_expand_X_SSE2", "filter_expand_Y_SSE2", "filter_shrink_X_SSE2", "filter_shrink_Y_SSE2", "grayscale_sse2", "invert_sse2"],
          ),
          "simd_transform_avx2.c": (
          ["pg_has_avx2", "_pg_has_avx2", "pg_avx2_at_runtime_but_uncompiled"],
          ["grayscale_avx2", "invert_avx2"],
          ),
          "scale_mmx.c": ([], []),
          }
          NO_INT_FILES = {"simd_surface_fill_sse2.c", "simd_surface_fill_avx2.c", "scale_mmx.c"}
          class Fmt(dict):
              def __missing__(self, key):
                  print("SETUP PLACEHOLDER MISSING", key)
                  return ""
          class PygameCeRecipe(CompiledComponentsPythonRecipe):
              version = "2.5.5"
              url = "https://github.com/pygame-community/pygame-ce/archive/refs/tags/{version}.tar.gz"
              site_packages_name = "pygame"
              name = "pygame-ce"
              depends = ["sdl2", "sdl2_image", "sdl2_mixer", "sdl2_ttf", "setuptools", "jpeg", "png"]
              call_hostpython_via_targetpython = False
              install_in_hostpython = False
              def _host_bin(self):
                  cands = [getattr(self, "hostpython_location", None), getattr(self.ctx, "hostpython", None)]
                  storage = getattr(self.ctx, "storage_dir", "") or ""
                  if storage:
                      cands.extend(glob.glob(join(storage, "build", "other_builds", "hostpython3", "*", "hostpython3", "native-build", "root", "usr", "local", "bin", "python")))
                  for h in cands:
                      if h and os.path.exists(h) and os.access(h, os.X_OK):
                          return h
                  return None
              def _host_env(self):
                  henv = os.environ.copy()
                  for k in ("CC", "CXX", "CFLAGS", "CXXFLAGS", "LDFLAGS", "CPPFLAGS", "AR", "LD", "ARCHFLAGS", "NDK_CC", "NDK_CXX", "PYTHONHOME", "PYTHONPATH"):
                      henv.pop(k, None)
                  henv["PIP_DISABLE_PIP_VERSION_CHECK"] = "1"
                  henv["PIP_USE_PEP517"] = "0"
                  return henv
              def _host_site(self, host):
                  sites = []
                  root = os.path.dirname(os.path.dirname(os.path.abspath(host)))
                  sites.extend(glob.glob(join(root, "lib", "python*", "site-packages")))
                  try:
                      out = subprocess.check_output([host, "-c", "import site; print('\\n'.join(site.getsitepackages()))"], env=self._host_env(), text=True)
                      for line in out.splitlines():
                          if line and line not in sites:
                              sites.append(line)
                  except Exception as e:
                      print("SITE LIST FAIL", e)
                  return sites
              def _ensure_host_pkgs(self, required=False):
                  host = self._host_bin()
                  print("ENSURE HOST host=", host, "required=", required)
                  if not host:
                      if required:
                          raise RuntimeError("hostpython missing")
                      return []
                  henv = self._host_env()
                  probe = subprocess.call([host, "-c", "import Cython; print(Cython.__version__)"], env=henv)
                  if probe != 0:
                      subprocess.call([host, "-m", "ensurepip", "--upgrade"], env=henv)
                      subprocess.check_call([host, "-m", "pip", "install", "setuptools==59.8.0", "wheel==0.38.4", "cython==0.29.36"], env=henv)
                      subprocess.check_call([host, "-c", "import Cython; print(Cython.__version__)"], env=henv)
                  print("HOST CYTHON OK")
                  return self._host_site(host)
              def _find_header(self, root, filename):
                  hits = []
                  if not root or not os.path.isdir(root):
                      return hits
                  for dirpath, dirnames, files in os.walk(root):
                      dirnames[:] = [d for d in dirnames if d not in (".git", "test", "docs", "Xcode", "VisualC", "mingw")]
                      if filename not in files:
                          continue
                      if any(b in dirpath for b in BAD):
                          continue
                      hits.append(dirpath)
                      parent = os.path.dirname(dirpath)
                      if os.path.basename(dirpath) == "SDL2" and parent not in hits:
                          hits.append(parent)
                  hits.sort(key=lambda p: (0 if p.replace("\\\\", "/").endswith("/include") else 1, len(p)))
                  return hits
              def _inc(self, dirs):
                  return " ".join("-I" + d for d in dirs[:4])
              def _stub_x86_simd(self):
                  for path in glob.glob("src_c/simd_*.c") + glob.glob("src_c/scale_mmx.c"):
                      bn = os.path.basename(path)
                      text = open(path, encoding="utf-8", errors="ignore").read()
                      ints, voids = [list(x) for x in STUBS.get(bn, ([], []))]
                      for m in re.finditer(r"(?:^|\n)\s*(?:static\s+)?(?:int|SDL_bool|bool)\s+([A-Za-z_][A-Za-z0-9_]*)\s*\(", text):
                          name = m.group(1)
                          if bn in NO_INT_FILES or name == "pg_HasSSE_NEON":
                              continue
                          if name not in ints and name not in voids:
                              ints.append(name)
                      for m in re.finditer(r"(?:^|\n)\s*(?:static\s+)?void\s+([A-Za-z_][A-Za-z0-9_]*)\s*\(", text):
                          name = m.group(1)
                          if name not in voids and name not in ints:
                              voids.append(name)
                      for m in re.finditer(r"\b((?:surface_fill_|alphablit_|blit_blend_|premul_|filter_|grayscale_|invert_|_?pg_has_|_?pg_Has|_?pg_sse|_?pg_neon|_?pg_avx)[A-Za-z0-9_]*)\s*\(", text):
                          name = m.group(1)
                          is_int = ("has_" in name.lower() or "HasSSE" in name or "at_runtime" in name)
                          if is_int:
                              if bn in NO_INT_FILES or name == "pg_HasSSE_NEON":
                                  continue
                              if name not in ints:
                                  ints.append(name)
                          else:
                              if name not in voids and name not in ints:
                                  voids.append(name)
                      lines = []
                      for name in ints:
                          lines.append("int %s(void) { return 0; }" % name)
                      for name in voids:
                          lines.append("void %s(void *a, void *b, void *c, void *d, void *e, void *f, void *g, void *h) {}" % name)
                      if not lines:
                          lines.append("int pg_android_dummy_%s(void) { return 0; }" % bn.replace(".", "_"))
                      open(path, "w").write("\n".join(lines) + "\n")
                      print("SIMD STUB", bn, "ints", len(ints), "voids", len(voids))
              def _copy_src_py(self, dst):
                  src_py = "src_py"
                  if not os.path.isdir(src_py):
                      return
                  os.makedirs(dst, exist_ok=True)
                  n = 0
                  for root, dirs, files in os.walk(src_py):
                      rel = os.path.relpath(root, src_py)
                      dest_dir = dst if rel == "." else join(dst, rel)
                      os.makedirs(dest_dir, exist_ok=True)
                      for f in files:
                          shutil.copy2(join(root, f), join(dest_dir, f))
                          n += 1
                  print("COPIED src_py files", n)
              def _flatten_so(self, dst):
                  if not os.path.isdir(dst):
                      return
                  sos = glob.glob(join(dst, "*.so")) + glob.glob(join(dst, "*", "*.so"))
                  for so in sos:
                      name = os.path.basename(so).split(".")[0] + ".so"
                      target = join(os.path.dirname(so), name)
                      if os.path.abspath(so) != os.path.abspath(target):
                          shutil.copy2(so, target)
              def prebuild_arch(self, arch):
                  super().prebuild_arch(arch)
                  self._cython_sites = self._ensure_host_pkgs(required=False)
                  with current_directory(self.get_build_dir(arch.arch)):
                      open("pyproject.toml", "w").write("[project]\nname = \"pygame-ce\"\nversion = \"2.5.5\"\ndescription = \"x\"\nreadme = \"README.rst\"\nrequires-python = \">=3.9\"\n\n[build-system]\nrequires = [\"setuptools\", \"wheel\"]\nbuild-backend = \"setuptools.build_meta\"\n")
                      sp = open("setup.py").read().replace("from setuptools import setup", "from distutils.core import setup")
                      open("setup.py", "w").write(sp)
                      self._stub_x86_simd()
                      setup_template = open(join("buildconfig", "Setup.Android.SDL2.in")).read()
                      png = self.get_recipe("png", self.ctx)
                      png_dir = png.get_build_dir(arch.arch)
                      png_lib_dir = join(png_dir, ".libs") if exists(join(png_dir, ".libs")) else png_dir
                      jpeg = self.get_recipe("jpeg", self.ctx)
                      jpeg_dir = jpeg.get_build_dir(arch.arch)
                      boot = self.ctx.bootstrap.build_dir
                      jni = join(boot, "jni")
                      libs = join(boot, "libs", arch.arch)
                      ndk_lib = getattr(arch, "ndk_lib_dir_versioned", "")
                      sdl_h = self._find_header(join(jni, "SDL"), "SDL.h") or [join(jni, "SDL", "include")]
                      ttf_h = self._find_header(jni, "SDL_ttf.h")
                      img_h = self._find_header(jni, "SDL_image.h")
                      mix_h = self._find_header(jni, "SDL_mixer.h")
                      sdl_includes = " " + self._inc(sdl_h) + " -L" + libs + " -L" + png_lib_dir + " -L" + jpeg_dir + ((" -L" + ndk_lib) if ndk_lib else "")
                      setup_file = setup_template.format_map(Fmt(sdl_includes=sdl_includes, sdl_ttf_includes=self._inc(ttf_h), sdl_image_includes=self._inc(img_h), sdl_mixer_includes=self._inc(mix_h), freetype_includes="", jpeg_includes="-I" + jpeg_dir, png_includes="-I" + png_dir))
                      setup_file = re.sub(r"^scrap\s+.*$", "# scrap disabled", setup_file, flags=re.M)
                      setup_file = setup_file.replace("-lharfbuzz", "").replace("-lfreetype", "")
                      open("Setup", "w").write(setup_file)
                      self._extra_cflags = " ".join([self._inc(sdl_h), self._inc(ttf_h), self._inc(img_h), self._inc(mix_h), "-I" + jpeg_dir, "-I" + png_dir, "-Wno-error", "-Wno-implicit-function-declaration"])
              def build_compiled_components(self, arch):
                  sites = self._ensure_host_pkgs(required=True)
                  recenv = self.get_recipe_env(arch)
                  if sites:
                      recenv["PYTHONPATH"] = ":".join(sites) + ":" + recenv.get("PYTHONPATH", "")
                  host = self._host_bin()
                  r = subprocess.call([host, "-c", "import Cython; print('CYTHON VISIBLE', Cython.__version__)"], env=recenv)
                  if r != 0:
                      raise RuntimeError("Cython not visible")
                  hostpython = sh.Command(host)
                  with current_directory(self.get_build_dir(arch.arch)):
                      shprint(hostpython, "setup.py", "build_ext", "-v", _env=recenv)
                      libs = glob.glob("build/lib.*")
                      if not libs:
                          os.makedirs("build/lib.linux-aarch64-3.11/pygame", exist_ok=True)
                          libs = glob.glob("build/lib.*")
                      dst = join(libs[0], "pygame")
                      self._copy_src_py(dst)
                      self._flatten_so(dst)
              def install_python_package(self, arch, name=None, env=None, is_dir=True):
                  dest = self.ctx.get_python_install_dir(arch.arch)
                  with current_directory(self.get_build_dir(arch.arch)):
                      libs = glob.glob("build/lib.*")
                      dst = join(dest, "pygame")
                      if os.path.isdir(dst):
                          shutil.rmtree(dst)
                      os.makedirs(dst, exist_ok=True)
                      if libs:
                          src = join(libs[0], "pygame")
                          if os.path.isdir(src):
                              shutil.copytree(src, dst, dirs_exist_ok=True)
                      self._copy_src_py(dst)
                      self._flatten_so(dst)
              def get_recipe_env(self, arch, **kwargs):
                  getter = super().get_recipe_env
                  try:
                      recenv = getter(arch, **kwargs)
                  except TypeError:
                      recenv = getter(arch)
                  recenv["USE_SDL2"] = "1"
                  recenv["PYGAME_CROSS_COMPILE"] = "TRUE"
                  recenv["PYGAME_ANDROID"] = "TRUE"
                  recenv["PIP_USE_PEP517"] = "0"
                  recenv["SETUPTOOLS_USE_DISTUTILS"] = "stdlib"
                  extra = getattr(self, "_extra_cflags", "")
                  if extra:
                      recenv["CFLAGS"] = recenv.get("CFLAGS", "") + " " + extra
                      recenv["CPPFLAGS"] = recenv.get("CPPFLAGS", "") + " " + extra
                  sites = getattr(self, "_cython_sites", None)
                  if sites:
                      recenv["PYTHONPATH"] = ":".join(sites) + ":" + recenv.get("PYTHONPATH", "")
                  return recenv
          recipe = PygameCeRecipe()
          ''').lstrip())
          compile(Path("app/p4a-recipes/pygame-ce/__init__.py").read_text(), "pygame-ce", "exec")
          print("recipes syntax OK")
          ENDPY

      - name: Patch buildozer.spec + inject runtime restore
        run: |
          python3 << 'PY'
          from pathlib import Path
          import re
          p = Path("app/buildozer.spec")
          t = p.read_text(encoding="utf-8", errors="replace")
          def set_opt(text, key, val):
              pat = rf'(?m)^[ \t]*#?[ \t]*{re.escape(key)}[ \t]*=.*$'
              line = f"{key} = {val}"
              if re.search(pat, text):
                  return re.sub(pat, line, text)
              return re.sub(r'(?m)^\[app\][ \t]*$', "[app]\n" + line, text, count=1)
          t = set_opt(t, "version", "0.1.0")
          t = set_opt(t, "android.accept_sdk_license", "True")
          t = set_opt(t, "p4a.branch", "master")
          t = set_opt(t, "p4a.local_recipes", "./p4a-recipes")
          t = set_opt(t, "p4a.setup_py", "False")
          t = set_opt(t, "android.ndk", "25b")
          t = set_opt(t, "android.api", "34")
          t = set_opt(t, "android.minapi", "24")
          t = set_opt(t, "android.ndk_api", "24")
          t = set_opt(t, "android.archs", "arm64-v8a")
          t = set_opt(t, "source.filename", "main.py")
          t = set_opt(t, "fullscreen", "1")
          t = set_opt(t, "requirements", "python3==3.11.10,hostpython3==3.11.10,pygame-ce,sdl2,sdl2_image,sdl2_mixer,sdl2_ttf,png,jpeg")
          # json 必须进包；扩展名干净无空格
          t = set_opt(t, "source.include_exts", "py,png,jpg,jpeg,gif,webp,bmp,mp3,ogg,wav,flac,ttf,ttc,otf,txt,json,pkl,spec,bin,dat,log,prof")
          t = set_opt(t, "source.exclude_dirs", ".git,__pycache__,p4a-recipes,.buildozer,bin")
          t = set_opt(t, "android.permissions", "WRITE_EXTERNAL_STORAGE,READ_EXTERNAL_STORAGE")
          t = set_opt(t, "android.wakelock", "True")
          p.write_text(t, encoding="utf-8")
          # 启动时按 filename.json 把 enc 还原成 orig（游戏仍写中文路径）
          hook = (
              "import os, sys, traceback, json, shutil\n"
              "def _log(msg):\n"
              "    homes = ['/storage/emulated/0/Download', '/sdcard/Download',\n"
              "             '/storage/emulated/0/Android/data/game.imprison.imprisonment/files',\n"
              "             '/sdcard/Android/data/game.imprison.imprisonment/files']\n"
              "    for k in ('ANDROID_PRIVATE', 'ANDROID_ARGUMENT', 'ANDROID_APP_PATH'):\n"
              "        v = os.environ.get(k)\n"
              "        if v: homes.append(v)\n"
              "    homes.append(os.path.dirname(os.path.abspath(__file__)))\n"
              "    for h in homes:\n"
              "        try:\n"
              "            os.makedirs(h, exist_ok=True)\n"
              "            fp = open(os.path.join(h, 'imprison-crash.txt'), 'a', encoding='utf-8')\n"
              "            fp.write(msg + chr(10)); fp.flush(); os.fsync(fp.fileno()); fp.close()\n"
              "        except Exception:\n"
              "            pass\n"
              "def _restore_filenames():\n"
              "    # 与构建时同一套映射：enc -> orig\n"
              "    path = os.path.join(os.path.dirname(os.path.abspath(__file__)), 'filename.json')\n"
              "    if not os.path.isfile(path):\n"
              "        path = 'filename.json'\n"
              "    if not os.path.isfile(path):\n"
              "        _log('RESTORE skip: no filename.json')\n"
              "        return\n"
              "    try:\n"
              "        data = json.load(open(path, encoding='utf-8'))\n"
              "    except Exception as e:\n"
              "        _log('RESTORE json fail ' + repr(e))\n"
              "        return\n"
              "    items = data.get('items') or []\n"
              "    _log('RESTORE items=' + str(len(items)))\n"
              "    ok = 0\n"
              "    for it in items:\n"
              "        enc = it.get('enc'); orig = it.get('orig')\n"
              "        if not enc or not orig:\n"
              "            continue\n"
              "        if os.path.isfile(orig) and os.path.getsize(orig) > 0:\n"
              "            ok += 1\n"
              "            continue\n"
              "        if not os.path.isfile(enc):\n"
              "            _log('RESTORE missing enc=' + enc)\n"
              "            continue\n"
              "        try:\n"
              "            parent = os.path.dirname(orig)\n"
              "            if parent:\n"
              "                os.makedirs(parent, exist_ok=True)\n"
              "            os.rename(enc, orig)\n"
              "            ok += 1\n"
              "        except Exception as e:\n"
              "            try:\n"
              "                shutil.copy2(enc, orig)\n"
              "                ok += 1\n"
              "                _log('RESTORE copy ' + enc + ' -> ' + orig)\n"
              "            except Exception as e2:\n"
              "                _log('RESTORE fail ' + enc + ' ' + repr(e2))\n"
              "    _log('RESTORE done ok=' + str(ok))\n"
              "    try:\n"
              "        if os.path.isdir('font'):\n"
              "            _log('font_ls=' + ','.join(sorted(os.listdir('font'))[:40]))\n"
              "    except Exception as e:\n"
              "        _log('font_ls fail ' + repr(e))\n"
              "_log('main BOOT ' + sys.version)\n"
              "_log('cwd=' + os.getcwd())\n"
              "_restore_filenames()\n"
              "def _hook(t, v, tb):\n"
              "    _log(''.join(traceback.format_exception(t, v, tb)))\n"
              "    sys.__excepthook__(t, v, tb)\n"
              "sys.excepthook = _hook\n"
          )
          main = Path("app/main.py")
          orig = main.read_text(encoding="utf-8", errors="ignore")
          if "_restore_filenames" not in orig:
              lines = orig.splitlines(keepends=True)
              i = 0
              if lines and lines[0].startswith("#!"):
                  i = 1
              if i < len(lines) and re.search(r"coding[:=]", lines[i]):
                  i += 1
              while i < len(lines) and lines[i].lstrip().startswith("from __future__ import"):
                  i += 1
              main.write_text("".join(lines[:i]) + hook + "".join(lines[i:]), encoding="utf-8")
              print("PREPENDED restore hook")
          if Path("app/__main__.py").exists():
              Path("app/__main__.py").write_text(main.read_text(encoding="utf-8"), encoding="utf-8")
                    # filename.json 必须存在
          assert Path("app/filename.json").is_file()
          print("spec + restore ready")
          PY
          test -f app/filename.json
          test -f app/main.py
          grep -n "include_exts\|version\|filename" app/buildozer.spec | head -20

      - name: Build APK
        run: |
          set +e
          cd app
          test -f main.py
          test -f filename.json
          echo "=== font after encode ==="
          ls -la font 2>/dev/null || true
          buildozer -v android debug > ../out.txt 2>&1
          code=$?
          mkdir -p ../art
          cp ../out.txt ../art/build.log
          cp filename.json ../art/filename.json
          find . -name "*.apk" -exec cp {} ../art/ \;
          echo "=== android/app sample ===" | tee -a ../art/build.log
          find .buildozer/android/app -maxdepth 3 -type f 2>/dev/null | head -40 | tee -a ../art/build.log
          ls -la .buildozer/android/app/font 2>/dev/null | tee -a ../art/build.log || true
          test -f .buildozer/android/app/filename.json && echo "filename.json in android/app" | tee -a ../art/build.log
          cd ..
          python3 extract.py
          ls -lah art
          ls -lah art/*.apk 2>/dev/null || true
          exit $code

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: build-out
          path: art
          if-no-files-found: ignore
